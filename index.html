<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Caption Generator</title>
  <style>
    body {
      background: #0d0d0d;
      color: #f7f2e8;
      font-family: sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    .card {
      background: #1c1a17;
      border: 1px solid #d4af37;
      border-radius: 8px;
      max-width: 500px;
      margin: 30px auto;
      padding: 24px;
    }
    .quote { font-size: 1.4rem; font-family: serif; margin-bottom: 8px; }
    .translation { color: #aaa; margin-bottom: 20px; }
    button {
      background: #d4af37;
      border: none;
      padding: 10px 18px;
      margin: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #b89326; }
  </style>
</head>
<body>

  <h1>Caption Pool</h1>
  <div class="card">
    <div class="quote" id="captionText">Loading...</div>
    <div class="translation" id="subText"></div>
    <button onclick="nextCaption()">Another One</button>
    <button onclick="copyToClipboard()">Copy Text</button>
  </div>

  <script>
    // 1. Data bank
    const captions = [
      { text: "Radiant & Elegant", sub: "光芒四射 · 優雅動人" },
      { text: "Timeless & Iconic", sub: "氣場經典 · 雋永迷人" },
      { text: "Sophisticated Charm", sub: "從容高雅 · 魅力十足" }
    ];

    let currentIndex = 0;

    // 2. Display function
    function showCaption(index) {
      document.getElementById("captionText").innerText = captions[index].text;
      document.getElementById("subText").innerText = captions[index].sub;
    }

    function nextCaption() {
      currentIndex = (currentIndex + 1) % captions.length;
      showCaption(currentIndex);
    }

    // 3. Copy function
    function copyToClipboard() {
      const fullText = captions[currentIndex].text + " — " + captions[currentIndex].sub;
      navigator.clipboard.writeText(fullText).then(() => {
        alert("Copied to clipboard!");
      });
    }

    // Initialize
    showCaption(0);
  </script>
</body>
</html>
